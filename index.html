
<section class="enquiry" id="enquiry">
    <div class="container">
        <h2 class="section-title">Client Enquiry Form</h2>

        <p class="enquiry-intro">
            Complete the form below and choose whether to send
            your enquiry through WhatsApp or email.
        </p>

        <form class="enquiry-form" id="clientEnquiry">

            <label for="clientName">Full Name *</label>
            <input type="text" id="clientName"
                placeholder="Enter your full name" required>

            <label for="clientPhone">Telephone Number *</label>
            <input type="tel" id="clientPhone"
                placeholder="Enter your telephone number" required>

            <label for="clientEmail">Email Address</label>
            <input type="email" id="clientEmail"
                placeholder="Enter your email address">

            <label for="service">How can we assist you? *</label>
            <select id="service" required>
                <option value="">Select a service</option>
                <option>Company Liquidation</option>
                <option>Corporate Insolvency</option>
                <option>Business Restructuring</option>
                <option>Business Advisory</option>
                <option>Other Enquiry</option>
            </select>

            <label for="clientMessage">Your Message *</label>
            <textarea id="clientMessage"
                placeholder="Please briefly explain your enquiry"
                required></textarea>

            <button type="button" class="submit-button"
                onclick="sendWhatsApp()">
                Send Enquiry via WhatsApp
            </button>

            <button type="button" class="email-button"
                onclick="sendEmail()">
                Send Enquiry via Email
            </button>

            <p class="form-note">
                Choose your preferred method. Review your enquiry
                before sending it.
            </p>

        </form>
    </div>
</section>

<style>
.email-button {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 13px 20px;
    background: #10233d;
    color: white;
    border: 2px solid #c8a24a;
    border-radius: 4px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.email-button:hover {
    background: #263f5e;
}
</style>

<script>
function getEnquiry() {
    const form = document.getElementById("clientEnquiry");

    if (!form.reportValidity()) {
        return null;
    }

    return {
        name: document.getElementById("clientName").value.trim(),
        phone: document.getElementById("clientPhone").value.trim(),
        email: document.getElementById("clientEmail").value.trim(),
        service: document.getElementById("service").value,
        message: document.getElementById("clientMessage").value.trim()
    };
}

function getEnquiryMessage(data) {
    return "NEW CLIENT ENQUIRY - WIL & COMPANY\n\n" +
        "Full Name: " + data.name + "\n" +
        "Telephone: " + data.phone + "\n" +
        "Email: " + (data.email || "Not provided") + "\n" +
        "Service Required: " + data.service + "\n\n" +
        "Message:\n" + data.message;
}

function sendWhatsApp() {
    const data = getEnquiry();

    if (!data) return;

    const message = encodeURIComponent(getEnquiryMessage(data));

    window.location.href =
        "https://wa.me/263779084912?text=" + message;
}

function sendEmail() {
    const data = getEnquiry();

    if (!data) return;

    const subject = encodeURIComponent(
        "New Client Enquiry - " + data.service
    );

    const body = encodeURIComponent(getEnquiryMessage(data));

    window.location.href =
        "mailto:wilandcompanypractitioners@gmail.com" +
        "?subject=" + subject + "&body=" + body;
}
</script>
